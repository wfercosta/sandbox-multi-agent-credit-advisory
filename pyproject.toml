[project]
name = "sandbox-multi-agent-credit-advisory"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "coverage>=7.13.5",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/agents/*",
    "packages/mcp-servers/*",
    "packages/shared",
    "packages/tools",
    "packages/memory",
    "packages/rag",
    "packages/observability",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "agents", "tools", "memory", "rag", "observability"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
